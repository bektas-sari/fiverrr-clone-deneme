<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kayıt Ol - Fiverr Clone</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <a href="index.html" class="logo-link">
                <i class="fas fa-arrow-left"></i>
                <span class="logo-text">Fiverr Clone</span>
            </a>
            
            <h1>Kayıt Ol</h1>
            
            <div class="social-login">
                <button class="social-btn google">
                    <i class="fab fa-google"></i>
                    Google ile Kayıt Ol
                </button>
                <button class="social-btn facebook">
                    <i class="fab fa-facebook-f"></i>
                    Facebook ile Kayıt Ol
                </button>
            </div>

            <div class="divider">
                <span>veya</span>
            </div>

            <form class="auth-form">
                <div class="form-group">
                    <label for="fullname">
                        <i class="fas fa-user"></i>
                        Ad Soyad
                    </label>
                    <input type="text" id="fullname" required placeholder="Ad ve soyadınız">
                </div>

                <div class="form-group">
                    <label for="email">
                        <i class="fas fa-envelope"></i>
                        E-posta
                    </label>
                    <input type="email" id="email" required placeholder="E-posta adresiniz">
                </div>

                <div class="form-group">
                    <label for="password">
                        <i class="fas fa-lock"></i>
                        Şifre
                    </label>
                    <div class="password-input">
                        <input type="password" id="password" required placeholder="Şifreniz">
                        <button type="button" class="toggle-password">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password-confirm">
                        <i class="fas fa-lock"></i>
                        Şifre Tekrar
                    </label>
                    <div class="password-input">
                        <input type="password" id="password-confirm" required placeholder="Şifrenizi tekrar girin">
                        <button type="button" class="toggle-password">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="user-type">
                        <i class="fas fa-users"></i>
                        Hesap Türü
                    </label>
                    <select id="user-type" required>
                        <option value="">Seçiniz</option>
                        <option value="buyer">Hizmet Almak İstiyorum</option>
                        <option value="seller">Hizmet Vermek İstiyorum</option>
                    </select>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" required>
                        <span>Kullanım şartlarını kabul ediyorum</span>
                    </label>
                </div>

                <button type="submit" class="btn-auth">Kayıt Ol</button>
            </form>

            <p class="auth-footer">
                Zaten hesabınız var mı? <a href="login.html">Giriş Yapın</a>
            </p>
        </div>
    </div>

    <script>
        // Şifre göster/gizle
        document.querySelectorAll('.toggle-password').forEach(button => {
            button.addEventListener('click', function() {
                const input = this.parentElement.querySelector('input');
                const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
                input.setAttribute('type', type);
                this.querySelector('i').classList.toggle('fa-eye');
                this.querySelector('i').classList.toggle('fa-eye-slash');
            });
        });

        // Form doğrulama
        const form = document.querySelector('.auth-form');
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            const password = document.querySelector('#password').value;
            const passwordConfirm = document.querySelector('#password-confirm').value;

            if (password !== passwordConfirm) {
                alert('Şifreler eşleşmiyor!');
                return;
            }

            // Burada kayıt işlemi yapılacak
            alert('Kayıt başarılı!');
            window.location.href = 'login.html';
        });
    </script>
</body>
</html>
